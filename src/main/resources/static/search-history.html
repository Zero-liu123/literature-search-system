<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检索历史 - 智能文献检索系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .user-info-bar { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 20px; color: white; }
        .btn-back { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.3s; }
        .history-item:hover { background: #f8f9fa; }
        .history-keyword { font-size: 1rem; color: #333; }
        .history-time { font-size: 0.8rem; color: #999; }
        .delete-history { background: none; border: none; color: #ff4757; cursor: pointer; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; }
        .delete-history:hover { background: #ff4757; color: white; }
        .clear-all { background: #ff4757; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .clear-all:hover { background: #ff3344; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 1100; }
    </style>
</head>
<body>
<div class="container">
    <div class="user-info-bar">
        <span id="userInfo" style="color: white;"></span>
        <button class="btn-back" onclick="goBack()">返回首页</button>
        <button class="btn-back" onclick="logout()">退出登录</button>
    </div>

    <div class="header">
        <h1>🕐 检索历史</h1>
        <p>您最近搜索过的关键词</p>
    </div>

    <div class="card">
        <div id="historyList">
            <div class="empty">加载中...</div>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="clear-all" onclick="clearAllHistory()" style="display: none;">清空所有历史</button>
        </div>
    </div>
</div>

<script>
    function getToken() { return localStorage.getItem('token'); }
    function getUser() { const userStr = localStorage.getItem('user'); return userStr ? JSON.parse(userStr) : null; }

    function checkLogin() {
        if (!getToken()) { window.location.href = '/login.html'; return false; }
        return true;
    }

    function displayUserInfo() {
        const user = getUser();
        if (user) {
            const roleName = user.role === 0 ? '普通用户' : (user.role === 1 ? '文献经略专员' : '管理员');
            document.getElementById('userInfo').textContent = `${user.nickname || user.username} (${roleName})`;
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    function goBack() { window.location.href = '/index.html'; }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function formatTime(timeStr) {
        const date = new Date(timeStr);
        const now = new Date();
        const diff = now - date;
        if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
        if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
        return `${date.getMonth() + 1}月${date.getDate()}日`;
    }

    async function loadHistory() {
        const token = getToken();
        if (!token) return;

        try {
            const response = await fetch('/api/literature/search-history', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.code === 200) {
                renderHistory(result.data || []);
            } else {
                showToast(result.message || '加载失败');
            }
        } catch (error) {
            showToast('加载失败');
        }
    }

    function renderHistory(histories) {
        const container = document.getElementById('historyList');
        const clearBtn = document.querySelector('.clear-all');

        if (!histories || histories.length === 0) {
            container.innerHTML = '<div class="empty">📭 暂无检索历史，去首页搜索吧！</div>';
            clearBtn.style.display = 'none';
            return;
        }

        clearBtn.style.display = 'block';
        container.innerHTML = histories.map(item => `
            <div class="history-item" onclick="searchAgain('${escapeHtml(item.keyword)}')">
                <div>
                    <div class="history-keyword">🔍 ${escapeHtml(item.keyword)}</div>
                    <div class="history-time">${formatTime(item.searchTime)}</div>
                </div>
                <button class="delete-history" onclick="deleteHistoryItem(${item.id}, event)">删除</button>
            </div>
        `).join('');
    }

    function searchAgain(keyword) {
        localStorage.setItem('searchKeyword', keyword);
        window.location.href = '/index.html';
    }

    async function deleteHistoryItem(id, event) {
        event.stopPropagation();
        const token = getToken();

        try {
            const response = await fetch(`/api/literature/search-history/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();
            if (result.code === 200) {
                showToast('删除成功');
                loadHistory();
            } else {
                showToast(result.message || '删除失败');
            }
        } catch (error) {
            showToast('删除失败');
        }
    }

    async function clearAllHistory() {
        if (!confirm('确定要清空所有检索历史吗？')) return;
        const token = getToken();

        try {
            const response = await fetch('/api/literature/search-history', {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();
            if (result.code === 200) {
                showToast('清空成功');
                loadHistory();
            } else {
                showToast(result.message || '清空失败');
            }
        } catch (error) {
            showToast('清空失败');
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 初始化
    if (checkLogin()) {
        displayUserInfo();
        loadHistory();
    }
</script>
</body>
</html>
