<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 智能文献检索系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .user-info-bar { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 20px; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #333; }
        .role-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; }
        .role-0 { background: #e8f4fd; color: #1976d2; }
        .role-1 { background: #fff3e0; color: #f5a623; }
        .role-2 { background: #e8f5e9; color: #4caf50; }
        select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; }
        .btn { padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.8rem; margin-left: 5px; }
        .btn-primary { background: #4a90e2; color: white; }
        .btn-primary:hover { background: #357abd; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-warning:hover { background: #e68900; }
        .btn-success { background: #4caf50; color: white; }
        .btn-success:hover { background: #3e8e41; }
        .btn-danger { background: #ff4757; color: white; }
        .btn-danger:hover { background: #ff3344; }
        .btn-back { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 1100; }
    </style>
</head>
<body>
<div class="container">
    <div class="user-info-bar">
        <span id="userInfo"></span>
        <button class="btn-back" onclick="goBack()">返回首页</button>
        <button class="btn-back" onclick="logout()">退出登录</button>
    </div>

    <div class="header">
        <h1>👥 用户管理</h1>
        <p>修改用户角色（仅管理员可见）</p>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>昵称</th>
                <th>邮箱</th>
                <th>当前角色</th>
                <th>修改角色</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="userTableBody">
            <tr><td colspan="7" style="text-align: center;">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function getToken() {
        return localStorage.getItem('token');
    }

    function getUser() {
        const userStr = localStorage.getItem('user');
        return userStr ? JSON.parse(userStr) : null;
    }

    function checkAdmin() {
        const user = getUser();
        if (!user || user.role !== 2) {
            showToast('权限不足，仅管理员可访问');
            setTimeout(() => { window.location.href = '/index.html'; }, 1500);
            return false;
        }
        return true;
    }

    function displayUserInfo() {
        const user = getUser();
        if (user) {
            const roleName = user.role === 0 ? '普通用户' : (user.role === 1 ? '文献贡献者' : '管理员');
            document.getElementById('userInfo').textContent = `${user.nickname || user.username} (${roleName})`;
        }
    }

    function getRoleName(role) {
        if (role === 0) return '普通用户';
        if (role === 1) return '文献经略专员';
        if (role === 2) return '管理员';
        return '未知';
    }

    function getRoleClass(role) {
        if (role === 0) return 'role-0';
        if (role === 1) return 'role-1';
        if (role === 2) return 'role-2';
        return '';
    }

    async function loadUsers() {
        const token = getToken();
        if (!token) return;

        try {
            const response = await fetch('/api/user/list', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.code === 200) {
                renderUserTable(result.data);
            } else {
                showToast(result.message || '加载失败');
            }
        } catch (error) {
            showToast('加载用户列表失败');
        }
    }

    function renderUserTable(users) {
        const tbody = document.getElementById('userTableBody');
        const currentUser = getUser();

        if (!users || users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">暂无用户</td></tr>';
            return;
        }

        // 统计管理员数量
        const adminCount = users.filter(u => u.role === 2).length;

        tbody.innerHTML = users.map(user => {
            const isAdmin = user.role === 2;
            const isOnlyAdmin = isAdmin && adminCount === 1;

            return `
        <tr>
            <td>${user.id}</td>
            <td>${escapeHtml(user.username)}</td>
            <td>${escapeHtml(user.nickname || '-')}</td>
            <td>${escapeHtml(user.email || '-')}</td>
            <td><span class="role-badge ${getRoleClass(user.role)}">${getRoleName(user.role)}</span></td>
            <td>
                <select id="roleSelect_${user.id}" ${isOnlyAdmin ? 'disabled style="background:#f0f0f0;cursor:not-allowed;"' : ''}>
                    <option value="0" ${user.role === 0 ? 'selected' : ''}>普通用户</option>
                    <option value="1" ${user.role === 1 ? 'selected' : ''}>文献经略专员</option>
                    <option value="2" ${user.role === 2 ? 'selected' : ''}>管理员</option>
                </select>
                ${isOnlyAdmin ? '<span style="color:#ff9800; margin-left:5px; cursor:help;" title="至少保留一名管理员，不可修改">⚠️</span>' : ''}
            </td>
            <td>
                <button class="btn btn-primary" onclick="updateUserRole(${user.id})" ${isOnlyAdmin ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>保存</button>
                ${user.id !== currentUser?.id ? `
                    ${user.status === 0 ?
                `<button class="btn btn-warning" onclick="disableUser(${user.id})">禁用</button>` :
                `<button class="btn btn-success" onclick="enableUser(${user.id})">启用</button>`
            }
                    <button class="btn btn-danger" onclick="deleteUser(${user.id})" ${isOnlyAdmin ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>删除</button>
                ` : ''}
            </td>
        </tr>
    `}).join('');
    }

    async function updateUserRole(userId) {
        const token = getToken();
        const select = document.getElementById(`roleSelect_${userId}`);
        const newRole = parseInt(select.value);

        // 获取当前用户
        const currentUser = getUser();

        try {
            // 先获取所有用户列表，检查管理员数量
            const usersResponse = await fetch('/api/user/list', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const usersResult = await usersResponse.json();

            if (usersResult.code === 200) {
                const allUsers = usersResult.data;
                const targetUser = allUsers.find(u => u.id === userId);

                // 统计管理员数量
                const adminCount = allUsers.filter(u => u.role === 2).length;

                // 核心逻辑：如果目标用户当前是管理员，且是唯一管理员，且要改成非管理员
                if (targetUser && targetUser.role === 2 && adminCount === 1 && newRole !== 2) {
                    showToast('❌ 至少需要保留一名管理员，无法修改角色');
                    // 恢复下拉框的值
                    document.getElementById(`roleSelect_${userId}`).value = targetUser.role;
                    return;
                }
            }

            // 执行修改
            const response = await fetch(`/api/user/${userId}/role?role=${newRole}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.code === 200) {
                showToast('角色修改成功');
                loadUsers(); // 刷新列表
            } else {
                showToast(result.message || '修改失败');
                // 恢复下拉框的值
                loadUsers();
            }
        } catch (error) {
            console.error('修改失败:', error);
            showToast('修改失败');
            loadUsers();
        }
    }
    async function disableUser(userId) {
        if (!confirm('确定要禁用该用户吗？')) return;
        const token = getToken();
        try {
            const response = await fetch(`/api/user/${userId}/disable`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();
            if (result.code === 200) {
                showToast('用户已禁用');
                loadUsers();
            } else {
                showToast(result.message || '操作失败');
            }
        } catch (error) {
            showToast('操作失败');
        }
    }

    async function enableUser(userId) {
        const token = getToken();
        try {
            const response = await fetch(`/api/user/${userId}/enable`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();
            if (result.code === 200) {
                showToast('用户已启用');
                loadUsers();
            } else {
                showToast(result.message || '操作失败');
            }
        } catch (error) {
            showToast('操作失败');
        }
    }

    async function deleteUser(userId) {
        const token = getToken();

        try {
            // 先获取用户列表，检查是否是唯一管理员
            const usersResponse = await fetch('/api/user/list', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const usersResult = await usersResponse.json();

            if (usersResult.code === 200) {
                const allUsers = usersResult.data;
                const targetUser = allUsers.find(u => u.id === userId);
                const adminCount = allUsers.filter(u => u.role === 2).length;

                // 如果是唯一管理员，不能删除
                if (targetUser && targetUser.role === 2 && adminCount === 1) {
                    showToast('❌ 至少需要保留一名管理员，无法删除');
                    return;
                }
            }

            if (!confirm('确定要永久删除该用户吗？此操作不可恢复！')) return;

            const response = await fetch(`/api/user/${userId}/permanent`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();
            if (result.code === 200) {
                showToast('用户已删除');
                loadUsers();
            } else {
                showToast(result.message || '操作失败');
            }
        } catch (error) {
            console.error('删除失败:', error);
            showToast('操作失败');
        }
    }
</script>
</body>
</html>
