<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献上传状况 - 智能文献检索系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .user-info-bar { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 20px; color: white; }
        .btn-back { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .literature-item { padding: 20px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 15px; background: white; transition: all 0.3s; }
        .literature-item:hover { box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .literature-title { font-size: 1.2rem; font-weight: 600; color: #333; margin-bottom: 10px; }
        .literature-meta { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 12px; font-size: 0.85rem; }
        .meta-item { background: #f0f0f0; padding: 4px 12px; border-radius: 20px; color: #666; }
        .status-pending { background: #fff3e0; color: #f5a623; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; }
        .status-approved { background: #e8f5e9; color: #4caf50; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; }
        .status-rejected { background: #ffebee; color: #ff4757; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; }
        .reject-reason { margin-top: 10px; padding: 10px; background: #fff3e0; border-radius: 8px; color: #f5a623; font-size: 0.85rem; }
        .resubmit-btn { background: #ff9800; color: white; border: none; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-left: 10px; }
        .resubmit-btn:hover { background: #e68900; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 8px; cursor: pointer; }
        .filter-btn.active { background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); color: white; }
        .detail-btn { background: #4a90e2; color: white; border: none; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="user-info-bar">
        <span id="userInfo" style="color: white;"></span>
        <button class="btn-back" onclick="goBack()">返回首页</button>
        <button class="btn-back" onclick="logout()">退出登录</button>
    </div>

    <div class="header">
        <h1>📤 文献上传状况</h1>
        <p>查看您上传的文献及审核状态</p>
    </div>

    <div class="card">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterByStatus('all')">全部</button>
            <button class="filter-btn" onclick="filterByStatus(0)">⏳ 待审核</button>
            <button class="filter-btn" onclick="filterByStatus(1)">✅ 已通过</button>
            <button class="filter-btn" onclick="filterByStatus(2)">❌ 已驳回</button>
        </div>
        <div id="results">
            <div class="empty">加载中...</div>
        </div>
    </div>
</div>

<!-- 重新提交模态框 -->
<div id="resubmitModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 20px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;">
        <h3 style="margin-bottom: 20px;">✏️ 重新提交文献</h3>
        <div class="form-group">
            <label>标题</label>
            <input type="text" id="resubmitTitle" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <div class="form-group">
            <label>作者</label>
            <input type="text" id="resubmitAuthor" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <div class="form-group">
            <label>期刊/会议</label>
            <input type="text" id="resubmitJournal" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <div class="form-group">
            <label>发表年份</label>
            <input type="number" id="resubmitYear" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <div class="form-group">
            <label>关键词</label>
            <input type="text" id="resubmitKeywords" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <div class="form-group">
            <label>DOI</label>
            <input type="text" id="resubmitDoi" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <div class="form-group">
            <label>摘要</label>
            <textarea id="resubmitAbstract" rows="4" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;"></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
            <button class="btn-back" onclick="closeResubmitModal()">取消</button>
            <button class="btn-back" style="background: #ff9800;" onclick="confirmResubmit()">确认重新提交</button>
        </div>
    </div>
</div>

<script>
    let currentFilter = 'all';
    let currentResubmitId = null;
    let allContributions = [];

    function getToken() { return localStorage.getItem('token'); }
    function getUser() { const userStr = localStorage.getItem('user'); return userStr ? JSON.parse(userStr) : null; }

    function checkLogin() {
        if (!getToken()) { window.location.href = '/login.html'; return false; }
        return true;
    }

    function displayUserInfo() {
        const user = getUser();
        if (user) {
            const roleName = user.role === 0 ? '普通用户' : (user.role === 1 ? '文献经略专员' : '管理员');
            document.getElementById('userInfo').textContent = `${user.nickname || user.username} (${roleName})`;
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    function goBack() { window.location.href = '/index.html'; }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function getStatusText(status) {
        if (status === 0) return '<span class="status-pending">⏳ 待审核</span>';
        if (status === 1) return '<span class="status-approved">✅ 已通过</span>';
        if (status === 2) return '<span class="status-rejected">❌ 已驳回</span>';
        return '未知';
    }

    function filterByStatus(status) {
        currentFilter = status;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (status === 'all') {
            document.querySelector('.filter-btn').classList.add('active');
            renderList(allContributions);
        } else {
            event.target.classList.add('active');
            const filtered = allContributions.filter(item => item.status === status);
            renderList(filtered);
        }
    }

    async function loadContributions() {
        const token = getToken();
        if (!token) return;

        try {
            const response = await fetch('/api/literature/my-contributions', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.code === 200) {
                allContributions = result.data || [];
                renderList(allContributions);
            } else {
                showToast(result.message || '加载失败');
                document.getElementById('results').innerHTML = '<div class="empty">加载失败，请重试</div>';
            }
        } catch (error) {
            showToast('加载失败');
            document.getElementById('results').innerHTML = '<div class="empty">加载失败，请重试</div>';
        }
    }

    function renderList(list) {
        const container = document.getElementById('results');

        if (!list || list.length === 0) {
            container.innerHTML = '<div class="empty">📭 暂无上传记录</div>';
            return;
        }

        container.innerHTML = list.map(item => `
            <div class="literature-item">
                <div class="literature-title">${escapeHtml(item.title || '无标题')}</div>
                <div class="literature-meta">
                    <span class="meta-item">👤 ${escapeHtml(item.authors || '未知作者')}</span>
                    <span class="meta-item">📅 ${item.publishYear || '未知年份'}</span>
                    <span class="meta-item">📄 ${escapeHtml(item.journal || '未知期刊')}</span>
                    <span>状态：${getStatusText(item.status)}</span>
                </div>
                ${item.abstractText ? `<div class="literature-abstract">📝 ${escapeHtml(item.abstractText.substring(0, 200))}${item.abstractText.length > 200 ? '...' : ''}</div>` : ''}
                ${item.status === 2 && item.reviewRemark ? `<div class="reject-reason">📌 驳回理由：${escapeHtml(item.reviewRemark)}</div>` : ''}
                <div class="item-actions" style="margin-top: 15px;">
                    <button class="detail-btn" onclick="viewDetail(${item.id})">📖 查看详情</button>
                    ${item.status === 2 ? `<button class="resubmit-btn" onclick="openResubmitModal(${item.id})">🔄 重新提交</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    function viewDetail(id) {
        localStorage.setItem('openDetailId', id);
        window.location.href = '/index.html';
    }

    function openResubmitModal(id) {
        currentResubmitId = id;
        const item = allContributions.find(i => i.id === id);
        if (item) {
            document.getElementById('resubmitTitle').value = item.title || '';
            document.getElementById('resubmitAuthor').value = item.authors || '';
            document.getElementById('resubmitJournal').value = item.journal || '';
            document.getElementById('resubmitYear').value = item.publishYear || '';
            document.getElementById('resubmitKeywords').value = item.keywords || '';
            document.getElementById('resubmitDoi').value = item.doi || '';
            document.getElementById('resubmitAbstract').value = item.abstractText || '';
            document.getElementById('resubmitModal').style.display = 'flex';
        }
    }

    function closeResubmitModal() {
        document.getElementById('resubmitModal').style.display = 'none';
        currentResubmitId = null;
    }

    async function confirmResubmit() {
        const token = getToken();
        const formData = new FormData();
        const literature = {
            title: document.getElementById('resubmitTitle').value,
            authors: document.getElementById('resubmitAuthor').value,
            journal: document.getElementById('resubmitJournal').value,
            publishYear: document.getElementById('resubmitYear').value ? parseInt(document.getElementById('resubmitYear').value) : null,
            keywords: document.getElementById('resubmitKeywords').value,
            doi: document.getElementById('resubmitDoi').value,
            abstractText: document.getElementById('resubmitAbstract').value
        };
        formData.append('literature', new Blob([JSON.stringify(literature)], {type: 'application/json'}));

        try {
            const response = await fetch(`/api/literature/${currentResubmitId}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            const result = await response.json();

            if (result.code === 200) {
                showToast('重新提交成功，等待审核');
                closeResubmitModal();
                loadContributions();
            } else {
                showToast(result.message || '提交失败');
            }
        } catch (error) {
            showToast('提交失败');
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 初始化
    if (checkLogin()) {
        displayUserInfo();
        loadContributions();
    }
</script>
</body>
</html>
