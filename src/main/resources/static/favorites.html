<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 智能文献检索系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .user-info-bar { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 20px; color: white; }
        .literature-list { list-style: none; }
        .literature-item { padding: 20px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 15px; background: white; }
        .literature-title { font-size: 1.2rem; font-weight: 600; color: #333; margin-bottom: 10px; cursor: pointer; }
        .literature-title:hover { color: #1a73e8; }
        .literature-meta { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 12px; font-size: 0.85rem; }
        .meta-item { background: #f0f0f0; padding: 4px 12px; border-radius: 20px; color: #666; }
        .keyword-tag { background: #e8f4fd; color: #1976d2; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; margin-right: 8px; }
        .item-actions { display: flex; gap: 10px; margin-top: 10px; }
        .detail-btn, .favorite-btn { padding: 6px 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .detail-btn { background: #4a90e2; color: white; }
        .favorite-btn { background: #ff9800; color: white; }
        .btn-back { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 1100; }
    </style>
</head>
<body>
<div class="container">
    <div class="user-info-bar">
        <span id="userInfo" style="color: white;"></span>
        <button class="btn-back" onclick="goBack()">返回首页</button>
        <button class="btn-back" onclick="logout()">退出登录</button>
    </div>

    <div class="header">
        <h1>⭐ 我的收藏</h1>
        <p>您收藏的文献列表</p>
    </div>

    <div class="card">
        <div id="results">
            <div class="empty">加载中...</div>
        </div>
    </div>
</div>

<script>
    let currentUserRole = null;

    function getToken() { return localStorage.getItem('token'); }
    function getUser() { const userStr = localStorage.getItem('user'); return userStr ? JSON.parse(userStr) : null; }

    function checkLogin() {
        if (!getToken()) { window.location.href = '/login.html'; return false; }
        return true;
    }

    function displayUserInfo() {
        const user = getUser();
        if (user) {
            const roleName = user.role === 0 ? '普通用户' : (user.role === 1 ? '文献经略专员' : '管理员');
            document.getElementById('userInfo').textContent = `${user.nickname || user.username} (${roleName})`;
            currentUserRole = user.role;
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    function goBack() { window.location.href = '/index.html'; }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function loadFavorites() {
        const token = getToken();
        if (!token) return;

        try {
            const response = await fetch('/api/literature/favorites', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.code === 200) {
                renderFavorites(result.data || []);
            } else {
                showToast(result.message || '加载失败');
            }
        } catch (error) {
            showToast('加载失败');
        }
    }

    async function removeFavorite(literatureId, element) {
        const token = getToken();
        if (!token) return;

        try {
            const response = await fetch(`/api/literature/favorite/${literatureId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.code === 200) {
                // 移除该项
                element.closest('.literature-item').remove();
                showToast('已取消收藏');
                // 检查是否还有文献
                const remaining = document.querySelectorAll('.literature-item').length;
                if (remaining === 0) {
                    document.getElementById('results').innerHTML = '<div class="empty">暂无收藏文献，去首页添加吧！</div>';
                }
            } else {
                showToast(result.message || '操作失败');
            }
        } catch (error) {
            showToast('操作失败');
        }
    }

    function viewDetail(id) {
        window.location.href = `/index.html?id=${id}`;
        // 保存到 localStorage 以便首页打开详情
        localStorage.setItem('openDetailId', id);
    }

    function renderFavorites(list) {
        const resultsDiv = document.getElementById('results');

        if (!list || list.length === 0) {
            resultsDiv.innerHTML = '<div class="empty">📭 暂无收藏文献，去首页添加吧！</div>';
            return;
        }

        resultsDiv.innerHTML = `
            <ul class="literature-list">
                ${list.map(item => `
                    <li class="literature-item">
                        <div class="literature-title" onclick="viewDetail(${item.id})">${escapeHtml(item.title || '无标题')}</div>
                        <div class="literature-meta">
                            <span class="meta-item">👤 ${escapeHtml(item.authors || item.author || '未知作者')}</span>
                            <span class="meta-item">📅 ${item.publishYear || item.year || '未知年份'}</span>
                            <span class="meta-item">📄 ${escapeHtml(item.journal || '未知期刊')}</span>
                        </div>
                        ${item.abstractText ? `<div class="literature-abstract">📝 ${escapeHtml(item.abstractText.substring(0, 200))}${item.abstractText.length > 200 ? '...' : ''}</div>` : ''}
                        ${item.keywords ? `
                            <div class="literature-keywords">
                                ${item.keywords.split(/[,，]+/).map(kw => `<span class="keyword-tag">#${kw.trim()}</span>`).join('')}
                            </div>
                        ` : ''}
                        <div class="item-actions">
                            <button class="detail-btn" onclick="viewDetail(${item.id})">📖 查看详情</button>
                            <button class="favorite-btn" onclick="removeFavorite(${item.id}, this)">⭐ 取消收藏</button>
                        </div>
                    </li>
                `).join('')}
            </ul>
        `;
    }

    // 初始化
    if (checkLogin()) {
        displayUserInfo();
        loadFavorites();
    }
</script>
</body>
</html>
