<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 智能文献检索系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .user-info-bar { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 20px; color: white; }
        .btn-back { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; outline: none; transition: all 0.3s; }
        .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        .form-group input:disabled { background: #f5f5f5; color: #999; }
        .password-input-wrapper { position: relative; }
        .password-input-wrapper input { padding-right: 45px; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #999; font-size: 1.2rem; background: none; border: none; }
        .avatar-section { text-align: center; margin-bottom: 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #1a73e8; cursor: pointer; }
        .avatar:hover { opacity: 0.8; }
        .avatar-input { display: none; }
        .avatar-hint { font-size: 0.8rem; color: #999; margin-top: 8px; }
        .btn-save { width: 100%; padding: 12px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(17,153,142,0.4); }
        .btn-change-pwd { background: #ff9800; margin-top: 10px; }
        .btn-danger { background: #ff4757; margin-top: 20px; }
        .btn-danger:hover { background: #ff3344; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab { padding: 8px 20px; cursor: pointer; border-radius: 8px; background: #f0f0f0; }
        .tab.active { background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .warning-text { font-size: 0.7rem; color: #999; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="user-info-bar">
        <span id="userInfo" style="color: white;"></span>
        <button class="btn-back" onclick="goBack()">返回首页</button>
        <button class="btn-back" onclick="logout()">退出登录</button>
    </div>

    <div class="header">
        <h1>👤 个人资料</h1>
        <p>管理您的个人信息</p>
    </div>

    <div class="card">
        <div class="tabs">
            <div class="tab active" onclick="showTab('info')">基本信息</div>
            <div class="tab" onclick="showTab('password')">修改密码</div>
        </div>

        <!-- 基本信息 -->
        <div id="infoTab" class="tab-content active">
            <div class="avatar-section">
                <img id="avatar" class="avatar" src="https://via.placeholder.com/100?text=Avatar" alt="头像" onclick="document.getElementById('avatarFile').click()">
                <div class="avatar-hint">点击头像上传新图片</div>
                <input type="file" id="avatarFile" class="avatar-input" accept="image/jpeg,image/png,image/gif">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" disabled>
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="nickname" placeholder="请输入昵称">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="email" placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label>角色</label>
                <input type="text" id="roleName" disabled>
            </div>
            <button class="btn-save" onclick="updateProfile()">保存修改</button>
        </div>

        <!-- 修改密码 -->
        <div id="passwordTab" class="tab-content">
            <div class="form-group">
                <label>当前密码</label>
                <div class="password-input-wrapper">
                    <input type="password" id="oldPassword" placeholder="请输入当前密码">
                    <button class="toggle-password" onclick="togglePassword('oldPassword')">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <div class="password-input-wrapper">
                    <input type="password" id="newPassword" placeholder="请输入新密码">
                    <button class="toggle-password" onclick="togglePassword('newPassword')">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <div class="password-input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                    <button class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</button>
                </div>
            </div>
            <button class="btn-save btn-change-pwd" onclick="changePassword()">修改密码</button>
        </div>

        <!-- 注销账户 -->
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
            <button class="btn-save btn-danger" onclick="deleteAccount()">🗑️ 注销账户</button>
            <p class="warning-text">⚠️ 注销后账号将被禁用，无法登录，请联系管理员恢复</p>
        </div>
    </div>
</div>

<script>
    let currentUser = null;

    function getToken() { return localStorage.getItem('token'); }
    function getUser() { const userStr = localStorage.getItem('user'); return userStr ? JSON.parse(userStr) : null; }

    function checkLogin() {
        if (!getToken()) { window.location.href = '/login.html'; return false; }
        return true;
    }

    function displayUserInfo() {
        const user = getUser();
        if (user) {
            const roleName = user.role === 0 ? '普通用户' : (user.role === 1 ? '文献经略专员' : '管理员');
            document.getElementById('userInfo').textContent = `${user.nickname || user.username} (${roleName})`;
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    function goBack() { window.location.href = '/index.html'; }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function showTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        if (tab === 'info') {
            document.querySelector('.tab').classList.add('active');
            document.getElementById('infoTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('passwordTab').classList.add('active');
        }
    }

    // 切换密码显示/隐藏
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const btn = input.nextElementSibling;
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }

    async function loadProfile() {
        const token = getToken();
        if (!token) return;

        try {
            const response = await fetch('/api/user/detail', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.code === 200 && result.data) {
                currentUser = result.data;
                document.getElementById('username').value = currentUser.username;
                document.getElementById('nickname').value = currentUser.nickname || '';
                document.getElementById('email').value = currentUser.email || '';

                const roleName = currentUser.role === 0 ? '普通用户' : (currentUser.role === 1 ? '文献经略专员' : '管理员');
                document.getElementById('roleName').value = roleName;

                if (currentUser.avatar && currentUser.avatar !== 'null') {
                    document.getElementById('avatar').src = currentUser.avatar;
                } else {
                    document.getElementById('avatar').src = 'https://via.placeholder.com/100?text=Avatar';
                }
            } else {
                showToast(result.message || '加载失败');
            }
        } catch (error) {
            showToast('加载失败');
        }
    }

    // 头像上传预览
    document.getElementById('avatarFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('avatar').src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    async function updateProfile() {
        const token = getToken();
        const nickname = document.getElementById('nickname').value;
        const email = document.getElementById('email').value;

        const formData = new FormData();
        formData.append('nickname', nickname);
        formData.append('email', email);

        const avatarFile = document.getElementById('avatarFile').files[0];
        if (avatarFile) {
            formData.append('avatar', avatarFile);
        }

        try {
            const response = await fetch('/api/user/profile', {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            const result = await response.json();

            if (result.code === 200) {
                showToast('保存成功');
                const user = getUser();
                if (user) {
                    user.nickname = nickname;
                    if (result.data && result.data.avatar) user.avatar = result.data.avatar;
                    localStorage.setItem('user', JSON.stringify(user));
                }
                displayUserInfo();
                loadProfile();
            } else {
                showToast(result.message || '保存失败');
            }
        } catch (error) {
            showToast('保存失败');
        }
    }

    async function changePassword() {
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!oldPassword || !newPassword || !confirmPassword) {
            showToast('请填写完整');
            return;
        }

        if (newPassword !== confirmPassword) {
            showToast('两次输入的新密码不一致');
            return;
        }

        if (newPassword.length < 6) {
            showToast('新密码长度至少6位');
            return;
        }

        const token = getToken();

        try {
            const response = await fetch('/api/user/password', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ oldPassword, newPassword })
            });
            const result = await response.json();

            if (result.code === 200) {
                showToast('密码修改成功，请重新登录');
                setTimeout(() => {
                    logout();
                }, 1500);
            } else {
                showToast(result.message || '修改失败');
            }
        } catch (error) {
            showToast('修改失败');
        }
    }

    // 注销账户
    async function deleteAccount() {
        if (!confirm('⚠️ 确定要注销账户吗？\n\n注销后：\n1. 您将无法登录系统\n2. 您的账号将被禁用\n3. 您的个人信息将被隐藏\n\n此操作不可逆！')) {
            return;
        }

        const token = getToken();
        if (!token) return;

        try {
            const response = await fetch('/api/user/delete', {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.code === 200) {
                showToast('账户已注销，即将退出登录');
                setTimeout(() => {
                    logout();
                }, 2000);
            } else {
                showToast(result.message || '注销失败');
            }
        } catch (error) {
            showToast('注销失败');
        }
    }

    // 初始化
    if (checkLogin()) {
        displayUserInfo();
        loadProfile();
    }
</script>
</body>
</html>
